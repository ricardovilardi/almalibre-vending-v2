<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Almalibre · Kiosko v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage-wrap">
  <div class="kiosk" id="kiosk">

    <!-- 0 · Salvapantallas -->
    <section class="screen" data-screen="attract">
      <video id="attractVideo" src="assets/video/attract.mp4" poster="assets/attract-poster.jpg" muted loop playsinline autoplay></video>
      <div class="attract-cta">TOCA AQUÍ PARA PEDIR <span class="hand">👆</span></div>
    </section>

    <!-- 1 · Inicio -->
    <section class="screen" data-screen="welcome">
      <img class="bg" id="welcomeBg" alt="">
      <div class="carousel" id="carousel"></div>
      <button class="app-btn start" data-go="book">TOCA AQUÍ PARA PEDIR</button>
    </section>

    <!-- 2 · Personaliza -->
    <section class="screen" data-screen="book">
      <img class="bg" src="export/onctuo_label_book_en.jpg" alt="">
      <div class="book-scroll">
        <img class="sec-label" src="export/onctuo_label_book_topping_fr.png" alt="Toppings">
        <div class="grid" id="gridSolid"></div>
        <img class="sec-label" src="export/onctuo_label_book_sauce_fr.png" alt="Salsas">
        <div class="grid" id="gridLiquid"></div>
      </div>
      <div class="app-bar">
        <button class="app-btn ghost" data-go="welcome">Volver</button>
        <div class="total" id="bookTotal"></div>
        <button class="app-btn" data-go="order">Siguiente</button>
      </div>
    </section>

    <!-- 3 · Resumen -->
    <section class="screen" data-screen="order">
      <img class="bg" src="export/onctuo_label_order_en.jpg" alt="">
      <div class="summary" id="summary"></div>
      <div class="app-bar">
        <button class="app-btn ghost" data-go="book">Volver</button>
        <div class="total" id="orderTotal"></div>
        <button class="app-btn" data-go="payment">Pagar</button>
      </div>
    </section>

    <!-- 4 · Pago -->
    <section class="screen" data-screen="payment">
      <img class="bg" src="export/onctuo_label_payment_en.jpg" alt="">
      <div class="pay-line"><span>Tu pedido:</span><b id="payLine"></b></div>
      <button class="tap-zone" id="tapCard" aria-label="Simular pago con tarjeta"></button>
      <button class="app-btn ghost pay-cancel" data-go="order">Cancelar</button>
      <div class="dialog" id="payDialog" hidden>
        <div class="dialog-card">
          <div class="dialog-icon">✕</div>
          <div class="dialog-title">Pago no válido</div>
          <div class="dialog-text">Vuelve a acercar tu tarjeta</div>
          <button class="app-btn" id="dialogOk">Entendido</button>
        </div>
      </div>
    </section>

    <!-- 5 · Preparando -->
    <section class="screen" data-screen="outing">
      <img class="bg" src="export/onctuo_label_outing_en.jpg" alt="">
      <div class="making">
        <img class="making-cup" src="assets/cup.png" alt="">
        <img class="progress" id="progress" src="export/onctuo_outing_process_1.png" alt="">
      </div>
      <div class="ready" id="ready" hidden>
        <div class="ready-card">¡Tu bowl está listo!<small>Recógelo abajo y disfruta 💜</small></div>
      </div>
    </section>

    <!-- 6 · Agotado -->
    <section class="screen" data-screen="soldout">
      <img class="bg" src="export/onctuo_label_sold_out_en.png" alt="">
    </section>

  </div>
</div>

<!-- Prototype controls (not part of the machine UI) -->
<nav class="proto-bar">
  <span class="proto-title">Almalibre v2</span>
  <label>Máquina
    <select id="slotSelect">
      <option value="pistacho">con Pistacho</option>
      <option value="crema">con Crema de cacahuete</option>
    </select>
  </label>
  <label>Inicio
    <select id="welcomeSelect">
      <option value="vanille">Variante A</option>
      <option value="mangues">Variante B</option>
    </select>
  </label>
  <button id="failPay">Simular pago fallido</button>
  <button data-go="soldout">Agotado</button>
  <button data-go="attract">Reiniciar</button>
</nav>
<script src="app.js"></script>
</body>
</html>
