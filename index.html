<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Almalibre · Kiosko v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage-wrap">
  <div class="kiosk" id="kiosk">

    <!-- 1 · Bienvenida: solo vídeo -->
    <section class="screen" data-screen="attract">
      <video id="attractVideo" src="assets/video/attract.mp4?v=4" poster="assets/attract-poster.jpg" muted loop playsinline autoplay></video>
      <button class="tap-cta" aria-label="Toca la pantalla para continuar">
        <span>TOCA LA PANTALLA<br>PARA CONTINUAR</span>
        <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#4A1F6E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M26 34V14a4 4 0 0 1 8 0v16"/><path d="M34 28a4 4 0 0 1 8 0v4"/><path d="M42 31a4 4 0 0 1 8 0v9c0 9-6 16-15 16h-2c-6 0-9-3-12-7l-7-10a4 4 0 0 1 6-5l6 5"/><path d="M30 2v5M18 6l3 4M42 6l-3 4M13 16h5M42 16h5"/></g></svg>
      </button>
    </section>

    <!-- 2 · Personaliza (fondo welcome_*: logo + info; app: slot imagen/vídeo + botón) -->
    <section class="screen light" data-screen="welcome">
      <img class="bg" src="export/onctuo_label_welcome_vanille_en.jpg" alt="">
      <div class="product-slot"><img src="assets/bowls-1.png" alt="Bowl de açaí Almalibre"></div>
      <button class="app-btn start" data-go="book">TOCA AQUÍ PARA PEDIR</button>
    </section>

    <!-- 3 · Toppings (book) -->
    <section class="screen light" data-screen="book">
      <img class="bg" src="export/onctuo_label_book_en.jpg" alt="">
      <div class="book-scroll">
        <img class="sec-label" src="export/onctuo_label_book_topping_en.png" alt="Sólidos">
        <div class="grid" id="gridSolid"></div>
        <img class="sec-label" src="export/onctuo_label_book_sauce_fr.png" alt="Líquidos">
        <div class="grid" id="gridLiquid"></div>
      </div>
      <div class="app-bar">
        <button class="app-btn secondary" data-go="welcome">Volver</button>
        <div class="total" id="bookTotal"></div>
        <button class="app-btn" data-go="order">Siguiente</button>
      </div>
    </section>

    <!-- 4 · Cantidad de bowls (order) -->
    <section class="screen light" data-screen="order">
      <img class="bg" src="export/onctuo_label_order_en.jpg" alt="">
      <div class="qty" id="qty"></div>
      <div class="app-bar">
        <button class="app-btn secondary" data-go="book">Volver</button>
        <div class="total" id="orderTotal"></div>
        <button class="app-btn" data-go="payment">Siguiente</button>
      </div>
    </section>

    <!-- 5 · Resumen (payment_*: fondo con texto; app: texto del pedido) -->
    <section class="screen light" data-screen="payment">
      <img class="bg" src="export/onctuo_label_payment_en.jpg" alt="">
      <div class="sum-head"><span>Seleccionado:</span><b id="sumQty"></b></div>
      <div class="sum-list" id="sumList"></div>
      <div class="app-bar">
        <button class="app-btn secondary" data-go="order">Volver</button>
        <div class="total" id="sumTotal"></div>
        <button class="app-btn" data-go="outing">Pagar</button>
      </div>
      <div class="todo-note">Pago con tarjeta: pendiente de definir con el proveedor</div>
    </section>

    <!-- 6 · Preparando -->
    <section class="screen light" data-screen="outing">
      <img class="bg" src="export/onctuo_label_outing_en.jpg" alt="">
      <div class="making">
        <img class="making-cup" src="assets/bowls-1.png" alt="">
        <img class="progress" id="progress" src="export/onctuo_outing_process_1.png" alt="">
      </div>
      <div class="ready" id="ready" hidden>
        <div class="ready-card">¡Tu bowl está listo!<small>Recógelo abajo y disfruta</small></div>
      </div>
    </section>

    <!-- Agotado -->
    <section class="screen" data-screen="soldout">
      <img class="bg" src="export/onctuo_label_sold_out_en.png" alt="">
    </section>

  </div>
</div>

<!-- Prototype controls (not part of the machine UI) -->
<nav class="proto-bar">
  <span class="proto-title">Almalibre v2</span>
  <label>Máquina
    <select id="slotSelect">
      <option value="pistacho">con Pistacho</option>
      <option value="crema">con Crema de cacahuete</option>
    </select>
  </label>
  <button data-go="soldout">Agotado</button>
  <button data-go="attract">Reiniciar</button>
</nav>
<script src="app.js"></script>
</body>
</html>
